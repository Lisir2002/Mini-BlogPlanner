name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist

      - name: PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Version contract
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            php tools/lint-version.php --tag="${GITHUB_REF_NAME}"
          else
            php tools/lint-version.php
          fi

      - name: Migration contract
        run: php tools/lint-migrations.php

      - name: Core boundary
        run: php tools/lint-core.php

      - name: Unit tests
        run: php tests/run.php

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, intl
          coverage: none
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-dev --classmap-authoritative

      - name: Build release
        run: |
          php bin/release.php build \
            --id="${GITHUB_REF_NAME}" \
            --out="${RUNNER_TEMP}/release" \
            --with-vendor \
            --commit="${GITHUB_SHA}"
          php bin/release.php verify --dir="${RUNNER_TEMP}/release"

      - name: Package release
        run: |
          cd "${RUNNER_TEMP}/release"
          zip -qr "${RUNNER_TEMP}/Mini-BlogPlanner-${GITHUB_REF_NAME}.zip" .
          cd "${RUNNER_TEMP}"
          sha256sum "Mini-BlogPlanner-${GITHUB_REF_NAME}.zip" > "Mini-BlogPlanner-${GITHUB_REF_NAME}.zip.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "${RUNNER_TEMP}/Mini-BlogPlanner-${GITHUB_REF_NAME}.zip"
            "${RUNNER_TEMP}/Mini-BlogPlanner-${GITHUB_REF_NAME}.zip.sha256"
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
