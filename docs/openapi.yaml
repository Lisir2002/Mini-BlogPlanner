openapi: 3.2.1
info:
  title: Mini-BlogPlanner API
  summary: 个人博客公开读取接口与受保护的管理接口。
  description: |
    所有响应均为 JSON。错误使用 RFC 9457 problem+json。
    公开内容接口匿名可读；`/api/v1/admin/*` 需要 `Authorization: Bearer mbp_<token>`。
    版本号与 version.json 的 `api` 轴保持一致。
  version: 1.9.0
  contact:
    name: Mini-BlogPlanner
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: 当前站点
paths:
  /api/v1/health:
    get:
      operationId: getApiHealth
      summary: 读取服务健康状态
      description: 检查数据库连接和结构版本是否与当前应用兼容。该接口不返回任何敏感配置。
      responses:
        "200":
          description: 服务可用，结构版本兼容。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 数据库不可用，或数据库结构版本不兼容。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [system]
  /healthz:
    get:
      operationId: getHealthz
      summary: 健康检查别名
      description: 与 `/api/v1/health` 返回相同结果，供探针和部署脚本使用。
      responses:
        "200":
          description: 服务可用。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: 服务不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [system]
  /api/v1/status:
    get:
      operationId: getApiStatus
      summary: 读取完整站点状态
      description: 返回版本、数据库连接、结构版本、公开内容计数和检查结果。只暴露公开可读信息，不包含连接地址、账号或服务器路径。
      responses:
        "200":
          description: 站点运行正常。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: 数据库或结构版本异常，响应仍为同样的状态对象。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
      tags: [system]
  /api/v1/posts:
    get:
      operationId: listPosts
      summary: 列出已发布文章
      description: 按发布时间倒序，最多 50 条。草稿和未到时间的文章不会出现。
      responses:
        "200":
          description: 文章列表。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PostSummary"
                  meta:
                    type: object
                    required: [count]
                    properties:
                      count:
                        type: integer
        "503":
          description: 文章服务不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [posts]
  /api/v1/tags:
    get:
      operationId: listTags
      summary: 列出有已发布文章的标签
      description: 按文章数量倒序。没有已发布文章的标签不会出现。
      responses:
        "200":
          description: 标签列表。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagSummary"
                  meta:
                    type: object
                    required: [count]
                    properties:
                      count:
                        type: integer
        "503":
          description: 标签服务不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [tags]
  /api/v1/tags/{slug}:
    get:
      operationId: getTag
      summary: 读取单个标签及其文章
      parameters:
        - name: slug
          in: path
          required: true
          description: 标签 slug。
          schema:
            type: string
            pattern: "^[a-z0-9-]{1,80}$"
      responses:
        "200":
          description: 标签详情与已发布文章列表。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TagDetail"
        "404":
          description: 标签不存在或没有已发布文章。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 标签服务不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [tags]
  /api/v1/posts/{slug}:
    get:
      operationId: getPost
      summary: 读取单篇文章
      parameters:
        - name: slug
          in: path
          required: true
          description: 文章 slug，只含小写字母、数字和短横线。
          schema:
            type: string
            pattern: "^[a-z0-9-]{1,190}$"
      responses:
        "200":
          description: 文章详情，包含正文 HTML。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Post"
        "404":
          description: 文章不存在或未发布。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 文章服务不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [posts]
  /api/v1/admin/status:
    get:
      operationId: getAdminStatus
      summary: 读取管理状态
      description: 需要 `status:read` 作用域的 Bearer 令牌。返回完整运行状态，并附带令牌名称。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 管理状态。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: "#/components/schemas/Status"
                  meta:
                    type: object
                    properties:
                      token: { type: string }
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/posts:
    get:
      operationId: listAdminPosts
      summary: 列出后台文章
      description: 需要 `content:read` 作用域的 Bearer 令牌。包含草稿和归档文章，不返回正文。
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [published, draft, archived] }
        - name: q
          in: query
          schema: { type: string, maxLength: 80 }
        - name: sort
          in: query
          schema: { type: string, enum: [updated, published, title], default: updated }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: 后台文章列表。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        slug: { type: string }
                        title: { type: string }
                        excerpt: { type: string }
                        status: { type: string }
                        published_at: { type: string }
                        updated_at: { type: string }
                        has_draft: { type: boolean }
                  meta:
                    type: object
                    properties:
                      total: { type: integer }
                      page: { type: integer }
                      pages: { type: integer }
                      per_page: { type: integer }
                      status: { type: string }
                      sort: { type: string }
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/comments:
    get:
      operationId: listAdminComments
      summary: 列出后台留言
      description: 需要 `comments:read` 作用域。支持状态、关键词和文章筛选，返回各状态计数；不返回留言邮箱。
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, approved, spam] }
        - name: q
          in: query
          description: 匹配称呼、正文、邮箱或文章标题。
          schema: { type: string, maxLength: 80 }
        - name: post_id
          in: query
          description: 只看某篇文章下的留言。
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: 后台留言列表。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminComment"
                  meta:
                    $ref: "#/components/schemas/AdminCommentListMeta"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/comments/bulk:
    post:
      operationId: bulkAdminComments
      summary: 批量处理留言
      description: 需要 `comments:write` 作用域。一次最多 100 个编号；删除留言会级联删除其回复。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [approved, pending, spam, delete] }
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 批量处理结果。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [action, affected, ids]
                    properties:
                      action: { type: string, enum: [approved, pending, spam, delete] }
                      affected: { type: integer, minimum: 0 }
                      ids:
                        type: array
                        items: { type: integer }
        "400":
          description: 请求体不是 JSON 对象。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "422":
          description: 操作或编号无效。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/comments/{id}:
    patch:
      operationId: updateAdminComment
      summary: 修改留言状态
      description: 需要 `comments:write` 作用域。approved 会记录通过时间；pending 撤回到待审；spam 标为垃圾。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, approved, spam] }
      responses:
        "200":
          description: 更新后的留言。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminComment"
        "400":
          description: 请求体不是 JSON 对象。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "404":
          description: 留言不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 状态无效。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
    delete:
      operationId: deleteAdminComment
      summary: 删除留言
      description: 需要 `comments:write` 作用域。删除父留言时会级联删除其回复。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CommentId"
      responses:
        "204":
          description: 留言已删除，无响应体。
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "404":
          description: 留言不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/media:
    get:
      operationId: listAdminMedia
      summary: 列出后台媒体
      description: 需要 `media:read` 作用域。支持文件名或编号搜索，并按格式、画幅、体积、上传时间和排序组合筛选，返回全库概览。
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: 匹配显示名称或图片编号。
          schema: { type: string, maxLength: 80 }
        - name: type
          in: query
          schema: { type: string, enum: [jpg, png, webp, gif] }
        - name: shape
          in: query
          description: 按画幅筛选，方图允许宽高相差 5%。
          schema: { type: string, enum: [landscape, portrait, square] }
        - name: weight
          in: query
          description: 按文件体积筛选，分界为 100KB 和 1MB。
          schema: { type: string, enum: [small, medium, large] }
        - name: period
          in: query
          description: 按上传时间筛选，分别为最近 1、7、30 天。
          schema: { type: string, enum: [today, week, month] }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, oldest, largest, name], default: newest }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: 媒体列表。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                  meta:
                    $ref: "#/components/schemas/MediaListMeta"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "503":
          description: 媒体服务暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
    post:
      operationId: uploadAdminMedia
      summary: 上传媒体
      description: 需要 `media:write` 作用域。使用 multipart/form-data，一次最多 5 张，单张不超过 5MB；类型以服务端检测为准。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  oneOf:
                    - type: string
                      format: binary
                    - type: array
                      maxItems: 5
                      items:
                        type: string
                        format: binary
      responses:
        "201":
          description: 至少一张图片已经保存。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Media"
                  meta:
                    type: object
                    required: [uploaded, errors]
                    properties:
                      uploaded: { type: integer, minimum: 1 }
                      errors:
                        type: array
                        items: { type: string }
        "400":
          description: 没有收到 file 字段。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "422":
          description: 所有图片都未通过大小、格式或尺寸校验。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 存储或数据库暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/media/bulk:
    post:
      operationId: bulkDeleteAdminMedia
      summary: 批量删除媒体
      description: 需要 `media:write` 作用域。一次最多 100 个编号；记录与磁盘文件一起删除，文章里的旧引用会失效。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 删除结果。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [affected, ids]
                    properties:
                      affected: { type: integer, minimum: 0 }
                      ids:
                        type: array
                        items: { type: integer }
        "400":
          description: 请求体不是 JSON 对象。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "422":
          description: 编号列表为空或超过上限。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 媒体服务暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/media/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: 图片主键。
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getAdminMedia
      summary: 读取图片详情
      description: 需要 `media:read` 作用域。
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 图片详情。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Media"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "404":
          description: 图片不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 媒体服务暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
    patch:
      operationId: renameAdminMedia
      summary: 重命名媒体
      description: 需要 `media:write` 作用域。只修改显示名称，磁盘文件名和公开地址保持不变。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 190 }
      responses:
        "200":
          description: 已更新。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Media"
        "400":
          description: 请求体不是 JSON 对象。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "404":
          description: 图片不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 名称为空或超过 190 个字。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 媒体服务暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
    delete:
      operationId: deleteAdminMedia
      summary: 删除媒体
      description: 需要 `media:write` 作用域。删除记录和磁盘文件，文章里的旧引用会失效。
      security:
        - bearerAuth: []
      responses:
        "204":
          description: 图片已删除，无响应体。
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "404":
          description: 图片不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 媒体服务暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/tags:
    get:
      operationId: listAdminTags
      summary: 列出后台标签
      description: 需要 `tags:read` 作用域。返回包含空标签、使用量、已发布文章数、创建与最近使用时间的完整列表，并带全站标签概览。
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: 按名称或 slug 模糊检索。
          schema: { type: string, maxLength: 60 }
        - name: status
          in: query
          schema: { type: string, enum: [all, used, empty], default: all }
        - name: sort
          in: query
          schema: { type: string, enum: [usage, name, recent], default: usage }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: 后台标签列表与概览。
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminTag"
                  meta:
                    $ref: "#/components/schemas/AdminTagListMeta"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
    post:
      operationId: createAdminTag
      summary: 新建标签
      description: 需要 `tags:write` 作用域。名称去除 HTML 标签、合并空白后最多 60 个字；名称或生成的 slug 冲突时返回 409。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "201":
          description: 标签已创建，`Location` 指向新资源。
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminTag"
        "400":
          description: 请求体不是 JSON 对象。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "409":
          description: 名称或 slug 已存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 名称无效。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/tags/{id}:
    get:
      operationId: getAdminTag
      summary: 读取单个标签
      description: 需要 `tags:read` 作用域。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "200":
          description: 标签详情。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminTag"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "404":
          description: 标签不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
    patch:
      operationId: renameAdminTag
      summary: 重命名标签
      description: 需要 `tags:write` 作用域。只修改显示名称，slug 保持不变。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "200":
          description: 更新后的标签。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/AdminTag"
        "400":
          description: 请求体不是 JSON 对象。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "404":
          description: 标签不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: 新名称已存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 名称无效。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
    delete:
      operationId: deleteAdminTag
      summary: 删除空标签
      description: 需要 `tags:write` 作用域。只有没有任何文章关联的空标签可以删除；有文章时必须先合并。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: 标签已删除，无响应体。
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "404":
          description: 标签不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: 标签仍有文章关联。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
  /api/v1/admin/tags/{id}/merge:
    post:
      operationId: mergeAdminTag
      summary: 合并标签
      description: 需要 `tags:write` 作用域。把来源标签的文章关联全部转到目标标签，并删除来源标签。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id]
              properties:
                target_id: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 合并结果与目标标签。
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [merged, source_id, target]
                    properties:
                      merged: { type: boolean }
                      source_id: { type: integer }
                      target:
                        $ref: "#/components/schemas/AdminTag"
        "400":
          description: 请求体不是 JSON 对象。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/TokenRequired"
        "403":
          $ref: "#/components/responses/TokenForbidden"
        "404":
          description: 来源标签不存在。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: 目标标签无效或与来源相同。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 管理接口暂时不可用。
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      tags: [admin]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: mbp_<token>
  parameters:
    CommentId:
      name: id
      in: path
      required: true
      description: 留言主键。
      schema: { type: integer, minimum: 1 }
    TagId:
      name: id
      in: path
      required: true
      description: 标签主键。
      schema: { type: integer, minimum: 1 }
  schemas:
    AdminComment:
      type: object
      required: [id, post_id, post_title, post_slug, parent_id, parent_author, parent_excerpt, author_name, body, status, created_at, approved_at]
      properties:
        id: { type: integer, minimum: 1 }
        post_id: { type: integer, minimum: 1 }
        post_title: { type: string }
        post_slug: { type: string }
        parent_id: { type: integer, minimum: 1, nullable: true }
        parent_author: { type: string, nullable: true }
        parent_excerpt: { type: string, nullable: true }
        author_name: { type: string }
        body: { type: string }
        status: { type: string, enum: [pending, approved, spam] }
        created_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time, nullable: true }
    AdminCommentListMeta:
      type: object
      required: [total, page, pages, per_page, status, q, post_id, counts]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pages: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        status: { type: string, enum: [all, pending, approved, spam] }
        q: { type: string }
        post_id: { type: integer, nullable: true }
        counts:
          type: object
          required: [all, pending, approved, spam]
          properties:
            all: { type: integer, minimum: 0 }
            pending: { type: integer, minimum: 0 }
            approved: { type: integer, minimum: 0 }
            spam: { type: integer, minimum: 0 }
    Media:
      type: object
      required: [id, name, mime, format, size_bytes, width, height, created_at, url, html]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        mime: { type: string, examples: ["image/png"] }
        format: { type: string, enum: [JPEG, PNG, WebP, GIF, IMAGE] }
        size_bytes: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        url: { type: string, examples: ["/media/12/abcdef.png"] }
        html: { type: string }
    MediaSummary:
      type: object
      required: [total, bytes, latest_at, types]
      properties:
        total: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0 }
        latest_at: { type: [string, "null"], format: date-time }
        types:
          type: object
          required: [jpg, png, webp, gif]
          properties:
            jpg: { type: integer, minimum: 0 }
            png: { type: integer, minimum: 0 }
            webp: { type: integer, minimum: 0 }
            gif: { type: integer, minimum: 0 }
    MediaListMeta:
      type: object
      required: [total, page, pages, per_page, q, type, shape, weight, period, sort, summary]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pages: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        q: { type: string }
        type: { type: string }
        shape: { type: string, enum: [landscape, portrait, square, ""] }
        weight: { type: string, enum: [small, medium, large, ""] }
        period: { type: string, enum: [today, week, month, ""] }
        sort: { type: string, enum: [newest, oldest, largest, name] }
        summary:
          $ref: "#/components/schemas/MediaSummary"
    AdminTag:
      type: object
      required: [id, name, slug, url, post_count, published_count, status, created_at, last_used_at]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        slug: { type: string }
        url: { type: string }
        post_count: { type: integer, minimum: 0 }
        published_count: { type: integer, minimum: 0 }
        status: { type: string, enum: [used, empty] }
        created_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
    AdminTagListMeta:
      type: object
      required: [total, page, pages, per_page, status, sort, q, summary]
      properties:
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pages: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        status: { type: string, enum: [all, used, empty] }
        sort: { type: string, enum: [usage, name, recent] }
        q: { type: string }
        summary:
          type: object
          required: [total, used, empty, links, top_name, top_count]
          properties:
            total: { type: integer, minimum: 0 }
            used: { type: integer, minimum: 0 }
            empty: { type: integer, minimum: 0 }
            links: { type: integer, minimum: 0 }
            top_name: { type: string }
            top_count: { type: integer, minimum: 0 }
    PostSummary:
      type: object
      required: [slug, title, excerpt, published_at, reading_minutes, url, tags]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        published_at: { type: string, format: date-time }
        reading_minutes: { type: integer, minimum: 1 }
        url: { type: string }
        tags:
          type: array
          items: { type: string }
    TagSummary:
      type: object
      required: [name, slug, url, post_count]
      properties:
        name: { type: string }
        slug: { type: string }
        url: { type: string }
        post_count: { type: integer, minimum: 1 }
    TagDetail:
      type: object
      required: [name, slug, url, posts]
      properties:
        name: { type: string }
        slug: { type: string }
        url: { type: string }
        posts:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"
    Post:
      allOf:
        - $ref: "#/components/schemas/PostSummary"
        - type: object
          required: [body_html, reactions]
          properties:
            body_html:
              type: string
              description: 已通过白名单过滤的 HTML；调用方仍需按自己的上下文转义。
            reactions:
              type: object
              required: [likes, dislikes]
              properties:
                likes: { type: integer, minimum: 0 }
                dislikes: { type: integer, minimum: 0 }
    Health:
      type: object
      required: [status, app, api, schema]
      properties:
        status:
          type: string
          const: ok
        app:
          type: string
          examples: ["0.6.0"]
        api:
          type: string
          examples: ["1.2.0"]
        schema:
          type: integer
          examples: [2026112006]
    Status:
      type: object
      required: [status, app, api, channel, checked_at, php, database, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        app: { type: string, examples: ["0.1.69"] }
        api: { type: string, examples: ["1.5.2"] }
        channel: { type: string, examples: [stable] }
        checked_at: { type: string, format: date-time }
        latency_ms: { type: integer, minimum: 0 }
        schema: { type: [integer, "null"], examples: [2026112106] }
        php:
          type: object
          properties:
            version: { type: string }
            sapi: { type: string }
            timezone: { type: string }
        database:
          type: object
          properties:
            connected: { type: boolean }
            driver: { type: string }
            version: { type: string }
            server_time: { type: string }
            latency_ms: { type: integer, minimum: 0 }
        content:
          type: object
          properties:
            published_posts: { type: integer, minimum: 0 }
            approved_comments: { type: integer, minimum: 0 }
            media: { type: integer, minimum: 0 }
            tags: { type: integer, minimum: 0 }
            last_published_at: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [id, label, status, detail, metric]
            properties:
              id: { type: string }
              label: { type: string }
              status: { type: string, enum: [ok, error] }
              detail: { type: string }
              metric: { type: string }
        error: { type: string, examples: [schema-mismatch] }
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
          examples: ["/problems/schema-behind"]
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          examples: ["/api/v1/health"]
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [pointer, message]
                properties:
                  pointer:
                    type: string
                  message:
                    type: string
  responses:
    TokenRequired:
      description: 缺少、无效、已过期或已撤销的令牌。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TokenForbidden:
      description: 令牌有效，但没有该接口所需作用域。
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
tags:
  - name: system
    description: 健康检查与运维探针。
  - name: posts
    description: 已发布文章的公开读取接口。
