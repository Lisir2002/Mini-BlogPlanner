    <rect x="82" y="74" width="1036" height="482" rx="28" fill="url(#grain)"/>

    <g transform="rotate(-5 300 82)">
      <rect x="216" y="60" width="190" height="42" rx="4" fill="#ead79b" opacity="0.86"/>
