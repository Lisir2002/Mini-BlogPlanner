    </g>

    <text x="145" y="190" fill="#b96145" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" letter-spacing="5">MINI-BLOGPLANNER · PRIVATE JOURNAL</text>
    <text x="142" y="302" fill="#2d2a26" font-family="Noto Serif CJK SC, Noto Serif CJK, serif" font-size="88" font-weight="700" letter-spacing="-4">日记Planner</text>
    <text x="146" y="358" fill="#48433c" font-family="Noto Sans CJK SC, sans-serif" font-size="31" font-weight="500" letter-spacing="2">把日子写进计划里。</text>

    <path d="M147 396h76" stroke="#c76b4d" stroke-width="5" stroke-linecap="round"/>
    <text x="146" y="458" fill="#7b7265" font-family="Noto Sans CJK SC, sans-serif" font-size="20" letter-spacing="1">文章 · 标签 · 随手记，都在同一本手账里。</text>
    <text x="146" y="497" fill="#a19685" font-family="ui-monospace, Menlo, monospace" font-size="16" letter-spacing="2">CREAM PAPER / TORN EDGES / QUIET WRITING</text>

