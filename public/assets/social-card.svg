    </pattern>
    <filter id="paper-shadow" x="-12%" y="-18%" width="124%" height="138%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3c3428" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#f5efdf"/>
