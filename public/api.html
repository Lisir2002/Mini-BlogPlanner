<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>API 文档 · Mini-BlogPlanner</title>
<link rel="preload" href="/assets/scalar.js" as="script" fetchpriority="high">
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>
  (function () {
    var entry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    var type = entry && entry.type;
    if (!type && performance.navigation && performance.navigation.type === 2) {
      type = 'back_forward';
    }
    if (type === 'back_forward') {
      document.documentElement.setAttribute('data-cream-nav', 'back_forward');
    }
  })();
</script>
<style>
html[data-cream-nav="back_forward"] #cream-loader{display:none!important}
body{margin:0;background:oklch(.968 .018 90);color:oklch(.245 .010 70);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid oklch(.885 .012 85);background:oklch(.998 .004 90)}
header strong{font-size:14px}
a{color:oklch(.680 .135 32);text-underline-offset:3px}
main{min-height:60vh}
noscript{display:block;padding:32px 20px}
#cream-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:oklch(.968 .018 90);color:oklch(.245 .010 70);opacity:1;transition:opacity .24s ease;pointer-events:none}
#cream-loader.is-hiding{opacity:0}
#cream-loader[hidden]{display:none}
.cream-loader-card{display:grid;justify-items:center;gap:12px;text-align:center}
.cream-loader-mark{width:48px;height:48px;border-radius:50%;border:3px solid oklch(.885 .012 85);border-top-color:oklch(.680 .135 32);animation:cream-spin .8s linear infinite;box-shadow:3px 3px 0 oklch(.245 .010 70 / .08)}
#cream-loader-label{font-size:14px;letter-spacing:.04em;font-weight:700}
#cream-loader-detail{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:oklch(.470 .010 70);letter-spacing:.08em;text-transform:uppercase}
@keyframes cream-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.cream-loader-mark{animation:none}}
</style>
</head>
<body>
<div id="cream-loader" role="status" aria-live="polite" aria-label="页面加载中">
  <div class="cream-loader-card">
    <span class="cream-loader-mark" aria-hidden="true"></span>
    <strong id="cream-loader-label">正在展开接口文档…</strong>
    <small id="cream-loader-detail">MINI-BLOGPLANNER · API</small>
  </div>
</div>
<noscript><style>#cream-loader{display:none!important}</style></noscript>
<script>
  window.setTimeout(function () {
    var loader = document.getElementById('cream-loader');
    if (!loader || loader.hidden) return;
    loader.classList.add('is-hiding');
    window.setTimeout(function () { loader.hidden = true; }, 300);
  }, 5000);
</script>
<header>
<strong>Mini-BlogPlanner · API v1</strong>
<a href="/docs/openapi.yaml">下载 OpenAPI 3.2.1</a>
</header>
<main>
<noscript>此页面使用 Scalar 渲染 OpenAPI。未启用 JavaScript 时可直接查看 <a href="/docs/openapi.yaml">YAML 源文件</a>。</noscript>
<script id="api-reference" data-url="/docs/openapi.yaml"></script>
<script src="/assets/scalar.js" defer fetchpriority="high"></script>
</main>
<script>
(() => {
  const loader = document.getElementById('cream-loader');
  const hide = () => {
    if (!loader || loader.hidden) return;
    loader.classList.add('is-hiding');
    setTimeout(() => { loader.hidden = true; }, 300);
  };
  addEventListener('load', hide, { once: true });
  addEventListener('pageshow', function (event) {
    if (event.persisted) {
      document.documentElement.setAttribute('data-cream-nav', 'back_forward');
      if (loader) loader.hidden = true;
    }
  });
  setTimeout(hide, 7000);
})();
</script>
</body>
</html>
