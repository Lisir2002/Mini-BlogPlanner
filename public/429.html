<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>请求太频繁</title>
<style>
:root{color-scheme:light;--paper:#f7f1e3;--ink:#2f2b26;--muted:#6f675c;--line:#d9cdb7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:ui-serif,Georgia,"Songti SC",serif}
main{width:min(100%,520px);padding:32px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.58);box-shadow:0 18px 50px rgba(80,60,30,.08)}
span{display:inline-block;padding:5px 10px;border:1px dashed var(--line);border-radius:999px;color:var(--muted);font-size:12px;letter-spacing:.12em}
h1{margin:18px 0 10px;font-size:clamp(26px,7vw,40px);line-height:1.15}
p{margin:0;color:var(--muted);line-height:1.9}
b{color:var(--ink)}
@media(max-width:520px){main{padding:24px;border-radius:16px}body{padding:16px}}
</style>
</head>
<body>
<main>
<span>RATE LIMITED</span>
<h1>翻页翻得太快了</h1>
<p>请求过于频繁，请 <b>{{retry_after}} 秒</b>后再试。页面内容没有丢失。</p>
</main>
</body>
</html>
